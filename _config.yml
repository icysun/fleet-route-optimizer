theme: jekyll-theme-slate
title: Fleet Route Optimizer Wiki
description: Complete documentation for the open-source fleet management and route optimization platform
show_downloads: true
google_analytics: G-XXXXXXXX

plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-relative-links

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

collections_dir: wiki

navigation:
  - title: "🏠 Home"
    url: "/"
  - title: "🚀 Quick Start"
    url: "/Quick-Start-Guide"
  - title: "🗄️ Database Setup"
    url: "/PostgreSQL-PostGIS-Setup"
  - title: "🔌 API Docs"
    url: "/REST-API-Documentation"
  - title: "🧠 Algorithms"
    url: "/Vehicle-Routing-Problem"
  - title: "🐳 Docker Deploy"
    url: "/Docker-Deployment"
  - title: "💡 Examples"
    url: "/Case-Studies"
  - title: "🤝 Contributing"
    url: "/Contributing-Guidelines"

footer_links:
  - title: "GitHub Repository"
    url: "https://github.com/vkondepati/fleet-route-optimizer"
  - title: "Issue Tracker"
    url: "https://github.com/vkondepati/fleet-route-optimizer/issues"
  - title: "Discussions"
    url: "https://github.com/vkondepati/fleet-route-optimizer/discussions"
  - title: "Discord Community"
    url: "https://discord.gg/fleet-optimizer"