services:
  # Test Database
  postgres-test:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: fleet_optimizer_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d fleet_optimizer_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test Redis
  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Test API Server
  api-test:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3003:3001"
      - "3004:3002"
    environment:
      - NODE_ENV=test
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_NAME=fleet_optimizer_test
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - API_PORT=3001
      - WS_PORT=3002
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./fleet-optimizer-postgres.html:/app/public/index.html

  # Test Web Interface
  web-test:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=test
      - REACT_APP_API_URL=http://localhost:3003
      - REACT_APP_WS_URL=ws://localhost:3004
    depends_on:
      - api-test
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev:web"

  # Test Runner
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test-minimal
    environment:
      - NODE_ENV=test
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_NAME=fleet_optimizer_test
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm test

volumes:
  postgres_test_data:
  redis_test_data: